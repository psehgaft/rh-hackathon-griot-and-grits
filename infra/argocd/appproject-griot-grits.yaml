apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: griot-grits
  namespace: openshift-gitops
spec:
  description: Project for Griot & Grits application delivery
  sourceRepos:
    - '*'
  destinations:
    - namespace: gng-user42
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
