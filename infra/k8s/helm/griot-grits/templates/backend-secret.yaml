{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "griot-grits.fullname" . }}-backend-secret
  labels:
{{ include "griot-grits.labels" . | indent 4 }}
type: Opaque
stringData:
  MONGODB_USERNAME: {{ .Values.backend.mongodb.username | quote }}
  MONGODB_PASSWORD: {{ .Values.backend.mongodb.password | quote }}
  MINIO_ACCESS_KEY: {{ .Values.backend.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.backend.minio.secretKey | quote }}
{{- end }}
