{{- if and .Values.frontend.enabled .Values.global.openshift.routes.enabled (.Capabilities.APIVersions.Has "route.openshift.io/v1") }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "griot-grits.fullname" . }}-frontend
  labels:
{{ include "griot-grits.labels" . | indent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "griot-grits.fullname" . }}-frontend
  port:
    targetPort: http
  tls:
    termination: {{ .Values.global.openshift.routes.tlsTermination }}
    insecureEdgeTerminationPolicy: {{ .Values.global.openshift.routes.insecurePolicy }}
{{- end }}
