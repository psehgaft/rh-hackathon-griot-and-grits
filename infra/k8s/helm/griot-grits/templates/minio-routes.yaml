{{- if and .Values.minio.enabled .Values.global.openshift.routes.enabled (.Capabilities.APIVersions.Has "route.openshift.io/v1") }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "griot-grits.fullname" . }}-minio-api
  labels:
{{ include "griot-grits.labels" . | indent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "griot-grits.fullname" . }}-minio
  port:
    targetPort: api
  tls:
    termination: {{ .Values.global.openshift.routes.tlsTermination }}
    insecureEdgeTerminationPolicy: {{ .Values.global.openshift.routes.insecurePolicy }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "griot-grits.fullname" . }}-minio-console
  labels:
{{ include "griot-grits.labels" . | indent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "griot-grits.fullname" . }}-minio
  port:
    targetPort: console
  tls:
    termination: {{ .Values.global.openshift.routes.tlsTermination }}
    insecureEdgeTerminationPolicy: {{ .Values.global.openshift.routes.insecurePolicy }}
{{- end }}
