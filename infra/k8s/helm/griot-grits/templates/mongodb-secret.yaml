{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "griot-grits.fullname" . }}-mongodb-secret
  labels:
{{ include "griot-grits.labels" . | indent 4 }}
type: Opaque
stringData:
  MONGODB_USER: {{ .Values.mongodb.auth.user | quote }}
  MONGODB_PASSWORD: {{ .Values.mongodb.auth.password | quote }}
  MONGODB_DATABASE: {{ .Values.mongodb.auth.database | quote }}
  MONGODB_ADMIN_PASSWORD: {{ .Values.mongodb.auth.adminPassword | quote }}
{{- end }}
