apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: griot-grits-dev
  namespace: openshift-gitops
spec:
  project: griot-grits
  source:
    repoURL: https://github.com/ORG/griot-grits-gitops.git
    targetRevision: main
    path: k8s/helm/griot-grits
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gng-user42
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
